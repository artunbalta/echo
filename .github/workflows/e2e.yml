# The browser suite. It is NOT on `pull_request`, and the reason is a measurement this repo already
# made about itself rather than a preference about speed.
#
# apps/web/playwright.config.ts launches chromium with `--use-angle=metal --enable-gpu` and says why
# in its own comment: headless chromium falls back to software rendering, and this app draws 43,018
# instanced props — a frame costs 568 ms that way against 8.3 ms on the GPU. That is not merely slow,
# it breaks correctness in the harness, because Playwright's actionability check needs an element's
# box unchanged across two consecutive animation frames before it will click. At half a second a
# frame the consent card never settles inside a click timeout, so every click times out on a button
# that is visible, unobstructed and the top element at its own centre.
#
# Metal is macOS-only and GitHub's Linux runners have no GPU, so on ubuntu-latest this suite would run
# in precisely the regime its own config records as broken. A red there would not mean the world
# regressed; it would mean the runner has no GPU. A gate whose red does not mean anything is worse
# than no gate, because people learn to ignore it — which is ⚑11's lesson exactly: the island did not
# render at all for three weeks while every gate stayed green.
#
# So: manual dispatch, on a macOS runner with a real GPU, which is the config's own measuring
# condition.
name: e2e

on:
  workflow_dispatch:
    inputs:
      engines:
        description: 'E2E_ALL_ENGINES=1 adds webkit, firefox and the iPhone 13 emulation'
        type: boolean
        default: false

jobs:
  e2e:
    # macos-latest is GitHub-hosted Apple silicon and does have a GPU. If this proves too slow or too
    # flaky, move to a self-hosted macOS runner — but MEASURE it before deciding, and record the
    # number here rather than in a commit message.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      E2E_ALL_ENGINES: ${{ inputs.engines && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # THE GATE: 24 of the 34 tests. `E2E_QUARANTINE=skip` drops the five spec files that are red
      # for a recorded reason — see playwright.config.ts, which holds the list and the reasons.
      #
      # playwright.config.ts starts the app itself (webServer, `reuseExistingServer: true`, a 180 s
      # boot budget), so there is no separate server step. It also pins `workers: 1`, and that is a
      # measurement rather than caution: the launch args uncap the frame rate, so ONE worker takes a
      # 12-core load average from 3.1 to 7.1 all by itself. On this tree, three workers is 6 failed
      # in 27.8 minutes and one worker is 21 passed in 1.1 -- twenty-five times faster AND green,
      # with every three-worker failure a timeout rather than an assertion. See the config comment.
      - name: e2e (quarantine excluded)
        env:
          E2E_QUARANTINE: skip
        run: npx playwright test
        working-directory: apps/web

      # THE KNOWN REDS. They run, they report, and they do not block. Ten tests across five files,
      # every one failing on an assertion rather than a clock, every one verified pre-existing.
      #
      # NOTHING HERE MOVES A THRESHOLD. 600,000 triangles is C16's number and 1.3 tiles is the
      # spec's; the point of a quarantine is to keep a number VISIBLE while the work happens, never
      # to retune it until it passes. That is the failure mode SOCIETY-PLAN §3 exists to catch, and
      # §3 item 7 is this plan doing it to itself.
      - name: e2e (the known reds, reported)
        continue-on-error: true
        env:
          E2E_QUARANTINE: only
        run: npx playwright test
        working-directory: apps/web

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
