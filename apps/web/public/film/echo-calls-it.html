<!doctype html>
<!--
  ECHO Calls It: the film, as the site shows it (DECISIONS C100). The landing puts this file in a frame
  (`app/_landing/Film.tsx`) and says which language with ?lang=. It is the film as it was cut, drawn
  live by its own script at whatever size the frame is, wide or tall, with its own sound. What differs
  from the cut that is shared as a video: the two faces come from beside this file, its language is
  the page's, and its last button goes to the waitlist of the page it is in.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>ECHO: a film in half a minute</title>
<meta name="robots" content="noindex">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* The film's two faces, served from beside it (SIL Open Font License; Jersey 15 by Sarah Cadigan-Fried, Pixelify Sans by Stefie Justprince). */
@font-face { font-family: "Jersey 15"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/jersey15-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Jersey 15"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/jersey15-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Pixelify Sans"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/pixelifysans-latin-ext.woff2) format("woff2"); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Pixelify Sans"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/pixelifysans-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

<style>
/* Layout: one full-bleed stage. The film is a canvas; the DOM is only the poster before it and the two ways on after it. */
:root {
  color-scheme: dark;
  --void: #07040b;
  --ink: #1c1326;
  --parchment: #f4e9d0;
  --echo: #a06cd5;
  --echo-soft: #c9b0ea;
  --ember: #e8c98a;
  /* one face for every word of the film, one for the mark */
  --text: "Jersey 15", "Pixelify Sans", ui-monospace, monospace;
  --mark: "Pixelify Sans", ui-monospace, monospace;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--parchment); font-family: var(--text); overflow: hidden; }
#stage { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--void); }
#film { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ui {
  position: absolute; inset: 0;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#poster { display: grid; grid-template-rows: 17% auto; justify-items: center; }
#poster .col { grid-row: 2; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; min-width: 0; }
.mark { margin: 0; font: 700 clamp(52px, 12vmin, 104px)/1 var(--mark); letter-spacing: .08em; padding-left: .08em; }
h1 { margin: 0; font: 400 clamp(24px, 4.6vmin, 36px)/1.15 var(--text); color: var(--echo-soft); text-wrap: balance; }
.btn {
  appearance: none; border: 0; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: .55em;
  min-height: 54px; padding: 0 30px; margin-top: 8px;
  background: var(--parchment); color: var(--ink);
  font: 400 27px/1 var(--text);
  /* the corners are cut a pixel square */
  clip-path: polygon(5px 0, calc(100% - 5px) 0, calc(100% - 5px) 5px, 100% 5px, 100% calc(100% - 5px), calc(100% - 5px) calc(100% - 5px), calc(100% - 5px) 100%, 5px 100%, 5px calc(100% - 5px), 0 calc(100% - 5px), 0 5px, 5px 5px);
  transition: transform .12s ease-out, background-color .12s ease-out;
}
.btn:hover { background: #fff8e6; }
.btn:active { transform: translateY(1px) scale(.985); }
.btn:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--echo); }
.btn .tri { width: 0; height: 0; border-left: 11px solid var(--ink); border-block: 7px solid transparent; }
.note { margin: 0; font: 400 17px/1.3 var(--text); letter-spacing: .1em; text-transform: uppercase; color: var(--parchment); opacity: .6; }
.lang { display: none; }
.quiet {
  appearance: none; background: none; border: 0; cursor: pointer;
  min-height: 40px; padding: 0 12px;
  font: 400 19px/1 var(--text); letter-spacing: .04em; color: var(--parchment); opacity: .55;
}
.quiet:hover { opacity: .9; }
.quiet[aria-pressed="true"] { opacity: 1; color: var(--ember); }
.quiet:focus-visible { outline: 2px solid var(--echo); outline-offset: 2px; opacity: 1; }
#after { pointer-events: none; padding: 0; }
#after > * { pointer-events: auto; position: absolute; }
#walk { display: block; }
#walk:focus-visible { outline: 3px solid var(--echo); outline-offset: 4px; }
#again { transform: translateX(-50%); white-space: nowrap; text-decoration: underline; text-underline-offset: 4px; opacity: .8; text-shadow: 0 0 8px var(--void); }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

<div id="stage">
  <canvas id="film" role="img" aria-label="ECHO: a film in half a minute."></canvas>

  <div id="poster" class="ui">
    <div class="col">
      <p class="mark">ECHO</p>
      <h1 id="p-title">A film in half a minute.</h1>
      <button id="play" class="btn" type="button"><span class="tri" aria-hidden="true"></span><span id="p-play">Play</span></button>
      <p class="note" id="p-hint">Sound on</p>
      <div class="lang" role="group" aria-label="Language">
        <button class="quiet" id="lang-en" type="button" aria-pressed="true">English</button>
        <button class="quiet" id="lang-tr" type="button" aria-pressed="false">Türkçe</button>
      </div>
    </div>
  </div>

  <div id="after" class="ui" hidden>
    <a id="walk" href="/#waitlist" target="_top" aria-label="Join the waitlist"></a>
    <button id="again" class="quiet" type="button">Play again</button>
  </div>
</div>

<script>
(() => {
'use strict';

// ───────────────────────────── the words ─────────────────────────────
// Written in Turkish first; the English is its own sentence, not a translation of it.
// "/" breaks a line everywhere, "|" only in a tall frame; *word* is said in the echo's colour.
const COPY = {
  tr: {
    dont: 'Noktaya|bakma.', looked: 'Baktın.', everyone: 'Herkes bakar.',
    pivot: 'Ama sıradakini|herkes aynı yapmaz.',
    purse1: 'Otların arasında|bir kese altın.', purse2: 'Kimse bakmıyor.', purse3: 'Sen ne yaparsın?',
    choices: 'Alırım.|Bırakırım.|Sahibini ararım.',
    looks: 'ECHO söylediğine değil,|yaptığına bakar.',
    key: 'Yaptıklarından|*seni* *öğrenen,*/sonra *senin* *gibi*|*davranan*|bir agent.',
    bet: 'ECHO, daha film başlamadan/senin ne yapacağını yazmıştı:', card: 'Bu filmi|sonuna kadar/izleyeceksin.', held: 'Ve izledin.',
    end: 'Tarayıcında küçük bir köy./Sen gez, o seni öğrensin.', walk: 'Sıraya gir',
    head: "ECHO'NUN TAHMİNLERİ", r2: 'bakacaksın', r3: 'sonuna kadar izleyeceksin',
    title: 'Yarım dakikalık bir film.', hint: 'Sesi aç', play: 'Oynat', again: 'Yeniden oynat',
    aria: 'Sıraya gir',
  },
  en: {
    dont: "Don't look|at the dot.", looked: 'You looked.', everyone: 'Everyone does.',
    pivot: 'But what comes next|is different for everyone.',
    purse1: 'A pouch of gold|in the grass.', purse2: 'No one is watching.', purse3: 'What do you do?',
    choices: 'I take it.|I leave it.|I look for its owner.',
    looks: 'ECHO watches what you do,|not what you say.',
    key: 'An agent that|*learns* *you*|from what you do,/then|*acts* *like* *you.*',
    bet: 'Before this film began,/ECHO wrote down|what you would do:', card: "You'll watch|this film/to the end.", held: 'And you did.',
    end: 'A small village in your browser./You walk around. It learns you.', walk: 'Join the waitlist',
    head: "ECHO'S GUESSES", r2: "you'll look", r3: "you'll watch to the end",
    title: 'A film in half a minute.', hint: 'Sound on', play: 'Play', again: 'Play again',
    aria: 'Join the waitlist',
  },
};

// ───────────────────────────── the clock ─────────────────────────────
// The picture is a pure function of this time, so the same film can be played live or photographed frame by frame.
const T = {
  dont: .7, dot: 1.5, looked: 3.3, everyone: 4.1, pivot: 5.3,
  purse: 7.1, noone: 9.1, what: 10.7, looks: 13.1,
  mark: 15.9, bet: 20.7, flap: 22.5, card: 23.0, end: 25.7,
};
const PICK = [11.4, 11.8, 12.2];          // the three answers
const KEY = [16.5, 17.8];                 // the two halves of the sentence the film is for
const HELD = .9;                          // after the card is read, the word under it
const DUR = 28.5;

const C = { void: '#07040b', deep: '#120c19', ink: '#1c1326', parch: '#f4e9d0', echo: '#a06cd5', soft: '#c9b0ea', ember: '#e8c98a', danger: '#f0a48a' };
const TXT = { weight: 400, family: '"Jersey 15", "Pixelify Sans", ui-monospace, monospace' };
const CAPS = { ...TXT, track: .08 };
const MARK = { weight: 700, family: '"Pixelify Sans", ui-monospace, monospace', track: .07 };

const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('film'), c = cv.getContext('2d');
const px = document.createElement('canvas'), g = px.getContext('2d'), grain = document.createElement('canvas');
const Q = new URLSearchParams(location.search);
const EXPORT = Q.has('export');
const calm = !EXPORT && matchMedia('(prefers-reduced-motion: reduce)').matches;

let lang = 'en';
// English, unless the page this sits in says its reader chose otherwise.
try { lang = Q.get('lang') || 'en'; } catch (e) {}
if (!COPY[lang]) lang = 'en';
let L = COPY[lang];

// ───────────────────────────── small maths ─────────────────────────────
const TAU = Math.PI * 2;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const sm = (a, b, x) => { x = clamp((x - a) / (b - a)); return x * x * (3 - 2 * x); };
const outCubic = x => 1 - Math.pow(1 - clamp(x), 3);
const inOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const outBack = x => { x = clamp(x); const k = 1.70158; return 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2); };
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

// ───────────────────────────── the frame ─────────────────────────────
let W = 0, H = 0, DPR = 1, U = 1, portrait = false;
let PS = 4, PW = 0, PH = 0;               // the pixel layer: one of its pixels is PS of the screen's
let field = null, village = null;         // the two places in the film

function resize() {
  const r = stage.getBoundingClientRect();
  W = Math.max(240, Math.round(r.width)); H = Math.max(240, Math.round(r.height));
  DPR = EXPORT ? Number(Q.get('dpr') || 1) : Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  portrait = H > W * 1.05; U = Math.min(W, H) / 100;
  PS = Math.max(3, Math.round(Math.min(W, H) / 150));
  PW = Math.ceil(W / PS); PH = Math.ceil(H / PS);
  px.width = PW; px.height = PH;
  field = portrait ? makePlace(.6, [.87, .5], [[.17, 9]]) : makePlace(.56, [.905, .3], [[.22, 9]]);
  field.purse = { x: Math.round(PW * .5), y: Math.round(field.HZ + (PH - field.HZ) * .44) };
  village = portrait ? makePlace(.82, [.82, .665], [[.05, 8], [.23, 10], [.43, 8], [.6, 11], [.8, 9]])
                     : makePlace(.84, [.9, .56], [[.06, 9], [.19, 8], [.31, 11], [.45, 8], [.58, 10], [.72, 8], [.85, 9]]);
  buildGrain(); placeAfter();
}
const lay = () => (portrait
  ? { top: .27, picks: [.365, .412, .459], everyone: .59, markY: .2, keyY: .575, betY: .25, envY: .6, end: { mark: .2, line: .345, url: .445, cta: .54 } }
  : { top: .26, picks: [.39], everyone: .65, markY: .27, keyY: .63, betY: .27, envY: .645, end: { mark: .2, line: .38, url: .5, cta: .6 } });

// ───────────────────────────── type ─────────────────────────────
function voice(v, size) {
  c.font = `${v.weight} ${size}px ${v.family}`;
  if ('letterSpacing' in c) c.letterSpacing = v.track ? `${(size * v.track).toFixed(2)}px` : '0px';
}
const trackFix = (v, size) => ('letterSpacing' in c && v.track ? size * v.track / 2 : 0);
function fit(rows, v, maxW, cap) {
  const widthAt = size => { voice(v, size); let w = 1; for (const r of rows) w = Math.max(w, c.measureText(r).width); return w; };
  let s = Math.min(cap, 100 * maxW / widthAt(100));
  for (let i = 0; i < 2; i++) s = Math.min(cap, s * maxW / widthAt(s));
  return s;
}

// The echo arrives first: a soft violet ghost of a line, on the screen before the line is.
function ghost(rows, v, size, cx, cy, lh, alpha, blur) {
  if (alpha <= .004) return;
  const OFF = 3000;
  c.save(); voice(v, size); c.textAlign = 'center'; c.textBaseline = 'middle';
  c.shadowColor = rgba(C.echo, Math.min(1, alpha)); c.shadowBlur = blur * DPR; c.shadowOffsetX = OFF * DPR; c.shadowOffsetY = 0;
  c.fillStyle = '#000';
  rows.forEach((r, i) => c.fillText(r, cx - OFF + trackFix(v, size), cy + (i - (rows.length - 1) / 2) * lh));
  c.restore();
}

// Every line of the film is set by this: one face, upright, in at an even pace and out again.
// o.big is a line that lands whole (its ghost first); o.at gives each "/" half its own moment.
function line(str, t0, t1, t, o = {}) {
  const a = t - t0, pre = o.pre ?? (o.big ? .5 : 0);
  if (a < -pre || t >= t1) return;
  const rows = [];
  str.split('/').forEach((half, hi) => (portrait ? half.split('|') : [half.split('|').join(' ')]).forEach((r, k) => rows.push({
    words: r.split(' ').map(w => ({ w: w.replace(/\*/g, ''), em: w[0] === '*' })),
    at: o.at ? o.at[hi] - t0 + k * (o.sub ?? .45) : rows.length * (o.stagger ?? .12),
  })));
  const v = o.voice || TXT, plain = rows.map(r => r.words.map(p => p.w).join(' '));
  const size = fit(plain, v, o.maxW || W * (portrait ? .86 : .76), o.max || (o.big ? (portrait ? H * .13 : H * .2) : (portrait ? H * .062 : H * .088)));
  const lh = size * (o.lh || 1.04), cx = W * (o.x ?? .5), cy = H * (o.y ?? .5);
  if (a < 0) { const q = (a + pre) / pre, s = lerp(1.12, 1.02, q); ghost(plain, v, size * s, cx, cy, lh * s, .42 * q * q, lerp(3, 1.2, q) * U); return; }
  const fade = 1 - sm(t1 - .22, t1, t), settle = o.big && !calm ? 1 + .06 * (1 - outCubic(a / .3)) : 1;
  c.save(); c.translate(cx, cy); c.scale(settle, settle);
  voice(v, size); c.textAlign = 'left'; c.textBaseline = 'middle';
  if (o.shadow) { c.shadowColor = 'rgba(7,4,11,.9)'; c.shadowBlur = U * 1.4 * DPR; }
  const sp = c.measureText(' ').width;
  rows.forEach((r, i) => {
    const q = calm ? (a >= r.at ? 1 : 0) : outCubic((a - r.at) / (o.big ? .14 : .32)); if (q <= 0) return;
    let x = -c.measureText(plain[i]).width / 2 + trackFix(v, size);
    const y = (i - (rows.length - 1) / 2) * lh + (o.big ? 0 : (1 - q) * size * .14);
    c.globalAlpha = q * fade * (o.alpha ?? 1);
    for (const p of r.words) { c.fillStyle = p.em ? (o.emColor || C.soft) : (o.color || C.parch); c.fillText(p.w, x, y); x += c.measureText(p.w).width + sp; }
  });
  c.restore();
}
function label(text, x, y, size, color, o = {}) {
  c.save(); voice(o.voice || TXT, size); c.textAlign = o.align || 'center'; c.textBaseline = 'middle';
  c.globalAlpha = o.alpha ?? 1; c.fillStyle = color; c.fillText(text, x, y); c.restore();
}
function checkMark(x, y, s, color, k) {
  if (k <= 0) return;
  c.save(); c.strokeStyle = color; c.lineWidth = Math.max(1.5, s * .34); c.lineCap = 'square'; c.lineJoin = 'miter';
  c.beginPath(); c.moveTo(x, y); c.lineTo(x + s * .42, y + s * .45);
  if (k > .4) c.lineTo(x + s * .42 + s * .85 * clamp((k - .4) / .6), y + s * .45 - s * clamp((k - .4) / .6));
  c.stroke(); c.restore();
}

// ───────────────────────────── the pixel layer ─────────────────────────────
function disc(cx, cy, r, col) {
  g.fillStyle = col;
  for (let j = -r; j <= r; j++) { const hw = Math.floor(Math.sqrt(r * r - j * j) + .4); g.fillRect(cx - hw, cy + j, hw * 2 + 1, 1); }
}
function blit(z = 1, fx = W / 2, fy = H / 2, alpha = 1) {
  if (alpha <= 0) return;
  c.save(); c.imageSmoothingEnabled = false; c.globalAlpha = alpha;
  c.drawImage(px, 0, 0, PW, PH, fx * (1 - z), fy * (1 - z), PW * PS * z, PH * PS * z);
  c.restore();
}

// A place at dusk: sky in ordered dither, a moon, two lines of hill, houses on the far one, grass to the bottom edge.
function makePlace(hz, moon, houses) {
  const p = { sky: document.createElement('canvas'), HZ: Math.round(PH * hz), blades: [], windows: [], purse: null };
  p.sky.width = PW; p.sky.height = PH;
  const s = p.sky.getContext('2d'), im = s.createImageData(PW, PH), d = im.data, HZ = p.HZ;
  const stops = [[10, 7, 16], [16, 11, 26], [26, 17, 41], [43, 28, 63], [70, 45, 86], [112, 70, 102]];
  const B = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const mx = Math.round(PW * moon[0]), my = Math.round(PH * moon[1]), mr = Math.max(4, Math.round(Math.min(PW, PH) * .05));
  const farY = x => HZ - PH * .05 - Math.sin(x * .043 + 1.2) * PH * .022 - Math.sin(x * .117 + .4) * PH * .008;
  const nearY = x => HZ - PH * .012 - Math.sin(x * .031 + 4.1) * PH * .016;
  for (let y = 0; y < PH; y++) for (let x = 0; x < PW; x++) {
    const th = (B[y & 3][x & 3] + .5) / 16; let col;
    if (y < HZ + 3) {
      const f = Math.pow(clamp(y / HZ), 1.7) * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(f));
      col = stops[f - i > th ? i + 1 : i];
      const dm = Math.hypot(x - mx, y - my);
      if (dm <= mr) col = (x - mx) + (y - my) > mr * .75 ? [205, 193, 176] : [244, 233, 208];
      else if (dm < mr * 3 && (1 - (dm - mr) / (mr * 2)) * .5 > th) col = [col[0] + 26, col[1] + 20, col[2] + 30];
      if (y >= farY(x)) col = [27, 19, 41];
      if (y >= nearY(x)) col = [19, 13, 30];
    } else col = [15, 12, 24];
    const o = (y * PW + x) * 4; d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = 255;
  }
  s.putImageData(im, 0, 0);
  s.fillStyle = 'rgb(214,202,182)'; s.fillRect(mx - Math.round(mr * .4), my - Math.round(mr * .3), 2, 1); s.fillRect(mx + 1, my + Math.round(mr * .35), 1, 1);
  for (const [fx, wd] of houses) {
    const hx = Math.round(PW * fx), hy = Math.round(farY(hx + wd / 2)) + 1;
    s.fillStyle = 'rgb(13,9,21)'; s.fillRect(hx, hy - 6, wd, 7);
    for (let j = 0; j < 4; j++) s.fillRect(hx - 1 + j, hy - 7 - j, wd + 2 - 2 * j, 1);
    s.fillRect(hx + wd - 3, hy - 12, 1, 4);
    p.windows.push({ x: hx + 2, y: hy - 4 }); if (wd >= 10) p.windows.push({ x: hx + wd - 4, y: hy - 4 });
  }
